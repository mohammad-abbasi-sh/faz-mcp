[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faz-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for FAZ.NET (faz.net) — Germany's Frankfurter Allgemeine Zeitung: latest news, search, stories by section and author, and full article text via the official RSS feeds"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
faz-mcp = "faz_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faz_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real www.faz.net feeds"]
